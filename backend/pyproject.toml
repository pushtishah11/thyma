[project]
name = "thyma-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi[standard]==0.162.0",
    "pydantic==2.14.1",
    "sqlalchemy==2.1.6",
    "alembic==1.20.1",
    "psycopg[binary]==3.3.6",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
    "ruff==0.17.2",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# E/F: errors, I: import order, B: common bugs, UP: modern Python syntax
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
# Our alembic/ migrations folder shares the package's name; it's still a library.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
# conftest must set DATABASE_URL before importing the app, so imports come after code.
"tests/conftest.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Import `app` straight from this folder. Don't rely on the editable install's
# .pth file: macOS can mark it hidden, and Python 3.12 then skips it.
pythonpath = ["."]
