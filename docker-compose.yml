services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: thyma
      POSTGRES_PASSWORD: thyma
      POSTGRES_DB: thyma
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once, on first start, to create the separate test database
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thyma -d thyma"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
